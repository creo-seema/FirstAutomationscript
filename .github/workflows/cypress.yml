name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
        continue-on-error: true

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/reports/html

      - name: Notify Microsoft Teams
        if: always()
        run: |
          curl -H 'Content-Type: application/json' -d '{
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  { "type": "TextBlock", "text": "Cypress Test Report", "weight": "bolder", "size": "medium" },
                  { "type": "TextBlock", "text": "Repo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nStatus: ${{ job.status }}", "wrap": true }
                ],
                "actions": [
                  { "type": "Action.OpenUrl", "title": "View Run & Download Report", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                ]
              }
            }]
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"